<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A13"/>
      <stop offset="50%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#0E1A34"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005A9C"/>
      <stop offset="100%" stop-color="#60C1E5"/>
    </linearGradient>
    <filter id="apiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#apiBg)"/>

  <!-- Code / Grid lines -->
  <g opacity="0.06" stroke="#60C1E5" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Header Window Bar -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
  <circle cx="55" cy="45" r="5" fill="#EF4444"/>
  <circle cx="72" cy="45" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="45" r="5" fill="#10B981"/>
  <text x="400" y="49" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#60C1E5" text-anchor="middle">RESTful API • Node.js / Express Microservices Architecture</text>

  <!-- Left Column: API Endpoints Directory -->
  <g transform="translate(45, 85)" filter="url(#apiGlow)">
    <rect width="280" height="380" rx="14" fill="#0B1325" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
    <!-- Title -->
    <text x="24" y="35" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#F8FAFC">API ENDPOINTS</text>
    <rect x="24" y="45" width="232" height="1" fill="rgba(96, 193, 229, 0.15)"/>

    <!-- Route 1: POST Auth -->
    <g transform="translate(20, 60)">
      <rect width="240" height="44" rx="8" fill="#0E1A34" stroke="rgba(0, 90, 156, 0.3)" stroke-width="1"/>
      <rect x="10" y="12" width="46" height="20" rx="4" fill="#3B82F6"/>
      <text x="33" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">POST</text>
      <text x="65" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">/api/v1/auth/login</text>
    </g>

    <!-- Route 2: GET Products (Active) -->
    <g transform="translate(20, 115)">
      <rect width="240" height="44" rx="8" fill="rgba(96, 193, 229, 0.12)" stroke="#60C1E5" stroke-width="1.2"/>
      <rect x="10" y="12" width="46" height="20" rx="4" fill="#10B981"/>
      <text x="33" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">GET</text>
      <text x="65" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#60C1E5">/api/v1/products</text>
    </g>

    <!-- Route 3: POST Orders -->
    <g transform="translate(20, 170)">
      <rect width="240" height="44" rx="8" fill="#0E1A34" stroke="rgba(0, 90, 156, 0.3)" stroke-width="1"/>
      <rect x="10" y="12" width="46" height="20" rx="4" fill="#3B82F6"/>
      <text x="33" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">POST</text>
      <text x="65" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">/api/v1/orders</text>
    </g>

    <!-- Route 4: PUT Cart -->
    <g transform="translate(20, 225)">
      <rect width="240" height="44" rx="8" fill="#0E1A34" stroke="rgba(0, 90, 156, 0.3)" stroke-width="1"/>
      <rect x="10" y="12" width="46" height="20" rx="4" fill="#F59E0B"/>
      <text x="33" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">PUT</text>
      <text x="65" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">/api/v1/cart/:id</text>
    </g>

    <!-- Route 5: DELETE Cart Item -->
    <g transform="translate(20, 280)">
      <rect width="240" height="44" rx="8" fill="#0E1A34" stroke="rgba(0, 90, 156, 0.3)" stroke-width="1"/>
      <rect x="10" y="12" width="46" height="20" rx="4" fill="#EF4444"/>
      <text x="33" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">DELETE</text>
      <text x="65" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">/api/v1/cart/:id</text>
    </g>

    <!-- Server Status Indicator -->
    <g transform="translate(20, 340)">
      <circle cx="10" cy="12" r="5" fill="#10B981"/>
      <text x="25" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">Node.js Server: ONLINE (24ms)</text>
    </g>
  </g>

  <!-- Right Column: Live Request / Response Terminal View -->
  <g transform="translate(345, 85)" filter="url(#apiGlow)">
    <rect width="410" height="380" rx="14" fill="#070E1C" stroke="rgba(96, 193, 229, 0.25)" stroke-width="1"/>
    
    <!-- Response Header -->
    <g transform="translate(20, 20)">
      <rect width="90" height="24" rx="6" fill="#10B981" opacity="0.2"/>
      <text x="45" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">200 OK</text>

      <text x="110" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">Content-Type: application/json</text>
    </g>

    <!-- Code Block / JSON Response -->
    <g transform="translate(24, 60)" font-family="'JetBrains Mono', monospace" font-size="12">
      <text x="0" y="15" fill="#F8FAFC">{</text>
      <text x="15" y="38" fill="#60C1E5">"status"</text><text x="80" y="38" fill="#F8FAFC">: </text><text x="95" y="38" fill="#10B981">"success"</text><text x="165" y="38" fill="#F8FAFC">,</text>
      <text x="15" y="61" fill="#60C1E5">"results"</text><text x="85" y="61" fill="#F8FAFC">: </text><text x="100" y="61" fill="#F59E0B">24</text><text x="120" y="61" fill="#F8FAFC">,</text>
      <text x="15" y="84" fill="#60C1E5">"data"</text><text x="60" y="84" fill="#F8FAFC">: {</text>
      
      <text x="30" y="107" fill="#60C1E5">"products"</text><text x="110" y="107" fill="#F8FAFC">: [</text>
      <text x="45" y="130" fill="#F8FAFC">{</text>
      <text x="60" y="153" fill="#60C1E5">"id"</text><text x="85" y="153" fill="#F8FAFC">: </text><text x="100" y="153" fill="#10B981">"prod_987x2"</text><text x="200" y="153" fill="#F8FAFC">,</text>
      <text x="60" y="176" fill="#60C1E5">"name"</text><text x="105" y="176" fill="#F8FAFC">: </text><text x="120" y="176" fill="#10B981">"Ergonomic Keyboard"</text><text x="280" y="176" fill="#F8FAFC">,</text>
      <text x="60" y="199" fill="#60C1E5">"price"</text><text x="110" y="199" fill="#F8FAFC">: </text><text x="125" y="199" fill="#F59E0B">129.99</text><text x="175" y="199" fill="#F8FAFC">,</text>
      <text x="60" y="222" fill="#60C1E5">"inStock"</text><text x="135" y="222" fill="#F8FAFC">: </text><text x="150" y="222" fill="#3B82F6">true</text>
      <text x="45" y="245" fill="#F8FAFC">}</text>
      <text x="30" y="268" fill="#F8FAFC">]</text>
      <text x="15" y="291" fill="#F8FAFC">}</text>
      <text x="0" y="314" fill="#F8FAFC">}</text>
    </g>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="498" rx="19" fill="none" stroke="rgba(96, 193, 229, 0.25)" stroke-width="1.5"/>
</svg>
