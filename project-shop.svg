<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C"/>
      <stop offset="50%" stop-color="#0D1A36"/>
      <stop offset="100%" stop-color="#060B14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142345"/>
      <stop offset="100%" stop-color="#0B1325"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60C1E5"/>
      <stop offset="100%" stop-color="#005A9C"/>
    </linearGradient>
    <filter id="shopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#shopBg)"/>

  <!-- Top Window Header -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
  <circle cx="55" cy="45" r="5" fill="#EF4444"/>
  <circle cx="72" cy="45" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="45" r="5" fill="#10B981"/>
  
  <!-- Brand logo & cart badge in top bar -->
  <text x="120" y="49" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#60C1E5">ApexStore</text>
  <rect x="650" y="33" width="95" height="24" rx="6" fill="#142345" stroke="rgba(96, 193, 229, 0.3)" stroke-width="1"/>
  <circle cx="665" cy="45" r="4" fill="#60C1E5"/>
  <text x="677" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Cart (3)</text>

  <!-- Categories / Filter Bar -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="75" height="28" rx="8" fill="#60C1E5"/>
    <text x="37" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#060A13" text-anchor="middle">All Tech</text>

    <rect x="85" y="0" width="90" height="28" rx="8" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
    <text x="130" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Electronics</text>

    <rect x="185" y="0" width="90" height="28" rx="8" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
    <text x="230" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Accessories</text>

    <rect x="285" y="0" width="80" height="28" rx="8" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
    <text x="325" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Gaming</text>
  </g>

  <!-- Product Grid -->
  <!-- Card 1 -->
  <g transform="translate(45, 125)" filter="url(#shopGlow)">
    <rect width="225" height="340" rx="14" fill="url(#cardGrad)" stroke="rgba(96, 193, 229, 0.25)" stroke-width="1"/>
    <!-- Image Box -->
    <rect x="15" y="15" width="195" height="150" rx="10" fill="#080E1C"/>
    <!-- Stylized Device Illustration -->
    <rect x="45" y="45" width="135" height="90" rx="8" fill="#1B365D" stroke="#60C1E5" stroke-width="1.5"/>
    <line x1="60" y1="65" x2="165" y2="65" stroke="#60C1E5" stroke-width="2"/>
    <line x1="60" y1="80" x2="140" y2="80" stroke="#94A3B8" stroke-width="2"/>
    <!-- Tag -->
    <rect x="25" y="25" width="55" height="20" rx="4" fill="#10B981" opacity="0.2"/>
    <text x="52" y="38" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">NEW</text>

    <!-- Details -->
    <text x="20" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Pro Developer Hub</text>
    <text x="20" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Ultra-fast thunderbolt dock</text>
    
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#60C1E5">$199.00</text>
    
    <!-- Button -->
    <rect x="20" y="275" width="185" height="36" rx="8" fill="url(#btnGrad)"/>
    <text x="112" y="297" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(290, 125)" filter="url(#shopGlow)">
    <rect width="225" height="340" rx="14" fill="url(#cardGrad)" stroke="rgba(96, 193, 229, 0.25)" stroke-width="1"/>
    <!-- Image Box -->
    <rect x="15" y="15" width="195" height="150" rx="10" fill="#080E1C"/>
    <!-- Stylized Device Illustration -->
    <circle cx="112" cy="90" r="45" fill="#005A9C" opacity="0.5"/>
    <circle cx="112" cy="90" r="35" fill="none" stroke="#60C1E5" stroke-width="3"/>
    <text x="112" y="96" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle">ANC</text>
    <!-- Tag -->
    <rect x="25" y="25" width="60" height="20" rx="4" fill="#3B82F6" opacity="0.2"/>
    <text x="55" y="38" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#60C1E5" text-anchor="middle">POPULAR</text>

    <!-- Details -->
    <text x="20" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Acoustic Pro Max</text>
    <text x="20" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Wireless studio headset</text>
    
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#60C1E5">$249.99</text>
    
    <!-- Button -->
    <rect x="20" y="275" width="185" height="36" rx="8" fill="url(#btnGrad)"/>
    <text x="112" y="297" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(535, 125)" filter="url(#shopGlow)">
    <rect width="225" height="340" rx="14" fill="url(#cardGrad)" stroke="rgba(96, 193, 229, 0.25)" stroke-width="1"/>
    <!-- Image Box -->
    <rect x="15" y="15" width="195" height="150" rx="10" fill="#080E1C"/>
    <!-- Stylized Device Illustration -->
    <rect x="40" y="60" width="145" height="60" rx="6" fill="#1B365D" stroke="#60C1E5" stroke-width="1.5"/>
    <circle cx="65" cy="90" r="8" fill="#60C1E5"/>
    <circle cx="95" cy="90" r="8" fill="#60C1E5"/>
    <circle cx="125" cy="90" r="8" fill="#60C1E5"/>
    <circle cx="155" cy="90" r="8" fill="#60C1E5"/>

    <!-- Details -->
    <text x="20" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Mechanical Deck 75%</text>
    <text x="20" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Tactile wireless switches</text>
    
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#60C1E5">$139.50</text>
    
    <!-- Button -->
    <rect x="20" y="275" width="185" height="36" rx="8" fill="url(#btnGrad)"/>
    <text x="112" y="297" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="498" rx="19" fill="none" stroke="rgba(96, 193, 229, 0.25)" stroke-width="1.5"/>
</svg>
