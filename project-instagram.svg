<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="igBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C"/>
      <stop offset="50%" stop-color="#0E1A34"/>
      <stop offset="100%" stop-color="#060A13"/>
    </linearGradient>
    <linearGradient id="storyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142345"/>
      <stop offset="100%" stop-color="#0D1830"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D"/>
      <stop offset="50%" stop-color="#005A9C"/>
      <stop offset="100%" stop-color="#60C1E5"/>
    </linearGradient>
    <filter id="igGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#igBg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#60C1E5" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Top Mockup Window Header -->
  <rect x="30" y="25" width="740" height="40" rx="10" fill="#0B1325" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
  <circle cx="55" cy="45" r="5" fill="#EF4444"/>
  <circle cx="72" cy="45" r="5" fill="#F59E0B"/>
  <circle cx="89" cy="45" r="5" fill="#10B981"/>
  <rect x="220" y="33" width="360" height="24" rx="6" fill="#142345" opacity="0.6"/>
  <text x="400" y="49" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">https://social.alaadev.local/feed</text>

  <!-- Left Sidebar (Mockup navigation) -->
  <g transform="translate(45, 85)">
    <rect width="160" height="380" rx="14" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.15)" stroke-width="1"/>
    <!-- Logo -->
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#60C1E5">InstaClone</text>
    <!-- Nav Items -->
    <rect x="18" y="65" width="124" height="34" rx="8" fill="rgba(96, 193, 229, 0.15)"/>
    <circle cx="34" cy="82" r="5" fill="#60C1E5"/>
    <text x="50" y="86" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#60C1E5">Feed</text>

    <circle cx="34" cy="126" r="5" fill="#94A3B8"/>
    <text x="50" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Explore</text>

    <circle cx="34" cy="166" r="5" fill="#94A3B8"/>
    <text x="50" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Messages</text>

    <circle cx="34" cy="206" r="5" fill="#94A3B8"/>
    <text x="50" y="210" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Notifications</text>

    <circle cx="34" cy="246" r="5" fill="#94A3B8"/>
    <text x="50" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Profile</text>

    <!-- Create Post CTA -->
    <rect x="18" y="315" width="124" height="36" rx="8" fill="url(#photoGrad)"/>
    <text x="80" y="338" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ New Post</text>
  </g>

  <!-- Main Feed Area -->
  <g transform="translate(225, 85)">
    <!-- Stories Bar -->
    <rect width="520" height="75" rx="14" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.15)" stroke-width="1"/>
    <!-- Story 1 -->
    <circle cx="50" cy="38" r="23" fill="none" stroke="url(#storyGrad)" stroke-width="2.5"/>
    <circle cx="50" cy="38" r="19" fill="#1B365D"/>
    <!-- Story 2 -->
    <circle cx="125" cy="38" r="23" fill="none" stroke="url(#storyGrad)" stroke-width="2.5"/>
    <circle cx="125" cy="38" r="19" fill="#005A9C"/>
    <!-- Story 3 -->
    <circle cx="200" cy="38" r="23" fill="none" stroke="url(#storyGrad)" stroke-width="2.5"/>
    <circle cx="200" cy="38" r="19" fill="#1B365D"/>
    <!-- Story 4 -->
    <circle cx="275" cy="38" r="23" fill="none" stroke="url(#storyGrad)" stroke-width="2.5"/>
    <circle cx="275" cy="38" r="19" fill="#005A9C"/>
    <!-- Story 5 -->
    <circle cx="350" cy="38" r="23" fill="none" stroke="url(#storyGrad)" stroke-width="2.5"/>
    <circle cx="350" cy="38" r="19" fill="#1B365D"/>
    <!-- Story 6 -->
    <circle cx="425" cy="38" r="23" fill="none" stroke="url(#storyGrad)" stroke-width="2.5"/>
    <circle cx="425" cy="38" r="19" fill="#005A9C"/>

    <!-- Feed Post Card -->
    <g transform="translate(0, 90)" filter="url(#igGlow)">
      <rect width="520" height="290" rx="14" fill="#0E1A34" stroke="rgba(96, 193, 229, 0.2)" stroke-width="1"/>
      <!-- Post Header -->
      <circle cx="35" cy="30" r="15" fill="none" stroke="url(#storyGrad)" stroke-width="2"/>
      <circle cx="35" cy="30" r="12" fill="#60C1E5"/>
      <text x="60" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">dev_creator</text>
      <text x="60" y="42" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">Cairo, Egypt • 2h ago</text>

      <!-- Post Image Mockup -->
      <rect x="20" y="58" width="480" height="155" rx="8" fill="url(#photoGrad)"/>
      <text x="260" y="130" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">&lt;Building Modern Full-Stack UI /&gt;</text>
      <text x="260" y="155" font-family="system-ui, sans-serif" font-size="12" fill="#E0F2FE" text-anchor="middle">Responsive feeds • Real-time Likes • Clean Components</text>

      <!-- Post Actions & Meta -->
      <g transform="translate(25, 228)">
        <!-- Heart Icon -->
        <circle cx="10" cy="10" r="8" fill="#EC4899" opacity="0.2"/>
        <circle cx="10" cy="10" r="4" fill="#EC4899"/>
        <text x="25" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">1,482 likes</text>

        <!-- Comments -->
        <circle cx="115" cy="10" r="8" fill="#60C1E5" opacity="0.2"/>
        <circle cx="115" cy="10" r="4" fill="#60C1E5"/>
        <text x="130" y="14" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">86 comments</text>

        <!-- Tech tags -->
        <rect x="360" y="0" width="115" height="22" rx="6" fill="#142345" stroke="rgba(96, 193, 229, 0.3)" stroke-width="1"/>
        <text x="417" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#60C1E5" text-anchor="middle">SPA • Social UI</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="798" height="498" rx="19" fill="none" stroke="rgba(96, 193, 229, 0.25)" stroke-width="1.5"/>
</svg>
